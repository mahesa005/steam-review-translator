# System C: LoRA fine-tune (experiments/task2_aspect/systems/train_peft.py).
seed: 42
labels: data/processed/task2_labels.jsonl   # train for training, val for model + threshold
base_model: roberta-base
max_length: 96            # tokens; review sentences are short
lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: [query, value]
train:
  epochs: 10
  batch_size: 16
  lr: 3.0e-4              # LoRA + head
  weight_decay: 0.01
  warmup_ratio: 0.06
thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]   # 1 - P(none) cut-offs tried on val
out_dir: artifacts/task2/peft
