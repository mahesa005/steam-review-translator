# Task 2 labeling pipeline (experiments/task2_aspect/labeling, see DESIGN.md).
seed: 42

input:
  sample: data/processed/candidate_sample.jsonl
  reviews_parquet: data/interim/task2_eda/reviews.parquet   # full review text for context

batching:
  max_sentences: 50        # whole reviews per batch, never split

prompts_dir: experiments/task2_aspect/labeling/prompts

stages:
  label:                   # stage 1
    model: claude-opus-5-5
    effort: medium
    max_tokens: 32000
  review:                  # stage 2, run once per reviewer
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 16000
    n_reviewers: 3
  finalize:                # stage 3, only sentences flagged by >= min_flags reviewers
    model: claude-opus-5-5
    effort: medium
    max_tokens: 32000
    min_flags: 1

pilot:
  n_batches: 2             # first run: this many batches, train games only
  split: train

verification:
  random_unflagged_share: 0.10   # owner also checks this share of unflagged sentences, per split

output:
  runs_dir: data/interim/task2_labeling      # requests, raw results, parsed outputs per run
  final_labels: data/processed/task2_labels.jsonl
  verify_queue: data/processed/task2_verify_queue.csv
