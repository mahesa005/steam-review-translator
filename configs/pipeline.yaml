# Which implementation each task uses. Names must exist in the registries in
# src/steam_review_translator/pipeline.py. `params` are passed to the class constructor.
sentiment:          # Task 1 (Farrel)
  impl: mock
  params: {}

aspect:             # Task 2 (Mahesa)
  impl: mock
  params:
    lexicon: configs/task2/lexicon.yaml

summarization:      # Task 3 (Lukas)
  # Default "mock" supaya demo & CI jalan tanpa extra berat (.[dev] saja).
  # Opsi lain (lihat configs/task3/summarization.yaml untuk daftar parameter lengkap):
  #   impl: extractive   -> baseline B1 (Lead-k / TextRank), tanpa ML
  #   impl: bart         -> BART (B2 zero-shot / E1 tanpa prefix / E2 dengan prefix)
  #   impl: t5           -> T5 (E3, prefix aspek)
  impl: mock
  params:
    top_k: 3
