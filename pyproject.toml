[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-translator"
version = "0.1.0"
description = "Steam review batch -> sentiment distribution, aspect table, and meta-review (IF5153 Group 17)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "IF5153 Group 17" }]
# Core stays light on purpose: the mock pipeline must run without torch.
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
task1 = [
    "scikit-learn>=1.3,<2",
    "transformers>=4.40,<6",
    "torch>=2.2,<3",
    "vaderSentiment>=3.3,<4",
]
task2 = [
    "bertopic>=0.16,<1",
    "sentence-transformers>=2.7,<6",
    "umap-learn>=0.5,<1",
    "hdbscan>=0.8.33,<1",
    "spacy>=3.7,<4",
    "gensim>=4.3,<5",
    "scikit-learn>=1.3,<2",
]
task3 = [
    "transformers>=4.40,<6",
    "torch>=2.2,<3",
    "datasets>=2.19,<5",
    "evaluate>=0.4,<1",
    "rouge-score>=0.1.2,<1",
    "nltk>=3.8,<4",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "pre-commit>=3.5,<5",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
]
all = ["steam-review-translator[task1,task2,task3,dev]"]

[project.scripts]
srt = "steam_review_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["steam_review_translator"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "demo.py"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

# Library berat per task (torch, transformers, ...) ada di extra .[task1]/.[task2]/.[task3],
# sedangkan CI hanya memasang .[dev]. Abaikan saja stub yang tidak ada.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "datasets.*",
    "rouge_score.*",
    "bertopic.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["steam_review_translator"]
